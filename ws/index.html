<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#080c18;color:#d0d5e3;overflow:hidden;height:100vh}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(180deg,rgba(8,12,24,0.97) 60%,rgba(8,12,24,0) 100%);pointer-events:none}

.hdr h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.3px}

.tog:hover{background:rgba(255,255,255,0.07)}
.tog.on-g{background:rgba(34,197,94,0.1);border-color:rgba(254,243,199,0.3);color:#22c55e}
.tog.on-y{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:#fbbf24}
.sw{width:30px;height:16px;border-radius:8px;background:#1a1f2e;position:relative;transition:.2s;flex-shrink:0}

.sb.open{right:0}

.legend{position:fixed;bottom:12px;left:18px;z-index:50;display:flex;gap:12px;font-size:10px;color:#4a5268}

.zb{width:28px;height:28px;border-radius:5px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#5b6478;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zb:hover{background:rgba(255,255,255,0.1);color:#fff}
</style>

<body>

<div>

</div>
<div class="filters">

</div>
<script>
const D=[{"name":"Trayd","type":"Portfolio Company","cat":"portfolio","ring":0,"connectedTo":["White Star Capital"],"howConnected":"","description":"Back-office OS for specialty trade contractors. Series A. NYC.","sourcingValue":"Every node in this map exists because White Star Capital closed this deal.","connBlack":"Direct. Recurring check-ins with founders including input on other NYC builders.","connRed":"","hasRed":false,"isTarget":false},{"name":"Suffolk Technologies","type":"Co-investor","cat":"investor","ring":1,"connectedTo":["Trayd"],"howConnected":"Seed, Series A","description":"Contech VC. BOOST accelerator.","sourcingValue":"ConTech focus. Pre-Series A pipeline from BOOST.","connBlack":"Co-investor. Active accelerator demo day.","connRed":"","hasRed":false,"isTarget":false},{"name":"RXR","type":"Co-investor","cat":"investor","ring":1,"connectedTo":["Trayd"],"howConnected":"Series A","description":"Real Estate operator, developer, investment manager. NYC.","sourcingValue":"Strategic investor for downstream capital. Knows what building owners want contractors to use.","connBlack":"Co-investor.","connRed":"","hasRed":false,"isTarget":false},{"name":"Y Combinator","type":"Co-investor","cat":"investor","ring":1,"connectedTo":["Trayd"],"howConnected":"Seed, Series A","description":"Accelerator. Trayd in W22. Public directory shows batch company status.","sourcingValue":"Trayd Batchmates. Directory for second-time founder tracking.","connBlack":"Co-investor. Accelerator for PortCo. Active accelerator demo day / batch list.","connRed":"Additional connectivity via other YC founders (Duke).","hasRed":true,"isTarget":false},{"name":"Bloomberg Beta","type":"Co-investor","cat":"investor","ring":1,"connectedTo":["Trayd"],"howConnected":"Seed","description":"Capitalized by Bloomberg. NYC-active.","sourcingValue":"Future of work' thesis portfolio companies.","connBlack":"Co-investor.","connRed":"Additional connectivity via their former investor (SF roommate).","hasRed":true,"isTarget":false},{"name":"Footprint","type":"Vendor","cat":"vendor","ring":1,"connectedTo":["Trayd"],"howConnected":"Worker identity / KYC","description":"Identity verification and data vaulting. Series A. NYC.","sourcingValue":"Potential investment target","connBlack":"Trayd is a Footprint customer; vetted customer reference.","connRed":"","hasRed":false,"isTarget":true},{"name":"inVest Ventures","type":"Founder Network","cat":"investor","ring":3,"connectedTo":["Trayd"],"howConnected":"CTO Cara Kessler (10 yrs at LinkedIn)","description":"Community VC fund supporting pre-seed, seed, & Series A startups founded by LinkedIn alumni.","sourcingValue":"Finding similar profiles to existing PortCo founders. Pipeline of technical co-founders and early-stage deals.","connBlack":"TBC if they saw Trayd during raise.","connRed":"Direct connectivity with GP of fund (GSV).","hasRed":true,"isTarget":false},{"name":"Kojo","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd","Suffolk Technologies","RXR"],"howConnected":"Portfolio Company","description":"Materials procurement for specialty trades. 600+ customers. Series C.","sourcingValue":"Same buyer as Trayd. Growth stage; sees additional vendors to add to pipeline","connBlack":"Additional White Star connectivity via investors Suffolk and RXR.","connRed":"Direct connectivity to Kojo's incubator, Fractal, and investor, Bienville (Salmira).","hasRed":true,"isTarget":false},{"name":"Handle","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd","Suffolk Technologies"],"howConnected":"Portfolio Company","description":"Lien management and cash flow for contractors. Growth Round.","sourcingValue":"Same buyer as Trayd. Growth stage; sees additional vendors to add to pipeline","connBlack":"White Star connectivity via investors Suffolk and RXR.","connRed":"Additional connectivity via investor, Zigg (Salmira, Bain).","hasRed":true,"isTarget":false},{"name":"Ediphi","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Suffolk Technologies","Trayd"],"howConnected":"Portfolio Company","description":"Cloud estimating. Pre-construction workflow. $18.5M total. Series A.","sourcingValue":"Estimating upstream of Trayd's payroll. Potential investment target.","connBlack":"Connectivity via investor.","connRed":"","hasRed":false,"isTarget":true},{"name":"Miter","type":"Competitor","cat":"competitor","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"Construction payroll / HR / workforce. Series B.","sourcingValue":"Same buyer as Trayd. Growth stage; sees additional vendors to add to pipeline","connBlack":"","connRed":"Connectivity via investor, Bessemer (Bain).","hasRed":true,"isTarget":false},{"name":"Lumber","type":"Competitor","cat":"competitor","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"AI construction workforce mgmt. Acquired BuilderFax. Series A.","sourcingValue":"Same buyer as Trayd. Potential investment target (dependent on overlap + White Star thesis).","connBlack":"","connRed":"Connectivity via investor, Tishman (Korea Finance Society).","hasRed":true,"isTarget":true},{"name":"PermitFlow","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"AI permitting for construction. NYC. Series B.","sourcingValue":"Same buyer as Trayd. Growth stage; sees additional vendors to add to pipeline","connBlack":"","connRed":"Connectivity via investor, Accel (Salmira).","hasRed":true,"isTarget":false},{"name":"TrueBuilt","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"End-to-end pre-construction platform. Seed.","sourcingValue":"Upstream of Trayd's payroll. Potential investment target.","connBlack":"","connRed":"Direct connectivity to TrueBuilt's incubator, Fractal, and investor, Bienville (Salmira).","hasRed":true,"isTarget":true},{"name":"CloudRig","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"AI field reporting for civil construction. No public funding.","sourcingValue":"Same area as Trayd but different sub-vertical. Potential investment target.","connBlack":"","connRed":"Direct connectivity to CloudRig's incubator, Fractal (Salmira)","hasRed":true,"isTarget":true},{"name":"Beam","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"Software for operations + finances of construction contractors. Series A.","sourcingValue":"Same buyer as Trayd. Potential investment target.","connBlack":"","connRed":"Connectivity via investor, Zigg (Salmira, Bain).","hasRed":true,"isTarget":true},{"name":"Tough Leaf","type":"Adjacent","cat":"adjacent","ring":2,"connectedTo":["Trayd"],"howConnected":"","description":"SaaS marketplace for DEI compliance in construction. NYC. Seed.","sourcingValue":"Same area as Trayd but different sub-vertical. Potential investment target.","connBlack":"","connRed":"Connectivity via investor, AlleyCorp (Salmira, GSV).","hasRed":true,"isTarget":true},{"name":"Bienville Capital","type":"VC","cat":"investor","ring":3,"connectedTo":["Kojo","TrueBuilt"],"howConnected":"","description":"Asset manager for institutional firms and family offices. $4.4B AUM. NYC.","sourcingValue":"Diverse pipeline. Clear willingness to share deals and find downstream capital for portfolio companies.","connBlack":"","connRed":"Direct (Salmira).","hasRed":true,"isTarget":false},{"name":"Fractal","type":"Incubator","cat":"investor","ring":3,"connectedTo":["Kojo","CloudRig","TrueBuilt"],"howConnected":"","description":"Vertical SaaS creation studio. NYC.","sourcingValue":"Large source of vertical SaaS seed companies. Many dissolved companies for second-time founder pipeline.","connBlack":"","connRed":"Direct (Salmira, Bain).","hasRed":true,"isTarget":false},{"name":"Zigg Capital","type":"PropTech VC","cat":"investor","ring":3,"connectedTo":["Handle","Beam"],"howConnected":"","description":"Seed-to-B. Construction + RE tech thesis. NYC.","sourcingValue":"Explicit contech thesis. Opportunity to trade notes on pipeline and partner on portfolio downstream capital.","connBlack":"","connRed":"Direct (Salmira, Bain).","hasRed":true,"isTarget":false},{"name":"Bessemer Venture Partners","type":"VC","cat":"investor","ring":3,"connectedTo":["Miter"],"howConnected":"","description":"Multi-stage. Published thesis on Built World AI.","sourcingValue":"Broader fund mandate with construction thesis. Opportunity to trade notes on pipeline and partner on portfolio downstream capital.","connBlack":"","connRed":"Direct (Bain).","hasRed":true,"isTarget":false},{"name":"Coatue","type":"VC","cat":"investor","ring":3,"connectedTo":["Miter"],"howConnected":"","description":"Multi-stage crossover.","sourcingValue":"Broader fund mandate. Larger check size on average-- opportunity to information share on smaller deals.","connBlack":"","connRed":"Direct (Bain).","hasRed":true,"isTarget":false},{"name":"Foundation Capital","type":"VC","cat":"investor","ring":3,"connectedTo":["Lumber"],"howConnected":"","description":"Early-stage. Build Accelerator.","sourcingValue":"Explicit focus on pre-revenue companies. Opportunity to partner on portfolio downstream capital, especially pre-seed.","connBlack":"","connRed":"","hasRed":false,"isTarget":false},{"name":"8VC","type":"VC","cat":"investor","ring":3,"connectedTo":["Kojo","Lumber"],"howConnected":"","description":"Early stage.","sourcingValue":"Opportunity to partner on portfolio downstream capital, especially pre-seed.","connBlack":"","connRed":"","hasRed":false,"isTarget":false},{"name":"Tishman Speyer","type":"Strategic Investor","cat":"investor","ring":3,"connectedTo":["Kojo","Lumber"],"howConnected":"","description":"Real estate developer and investor. NYC.","sourcingValue":"Demand-side signal. NYC.","connBlack":"","connRed":"Direct (Salmira, KFS).","hasRed":true,"isTarget":false},{"name":"Battery Ventures","type":"VC","cat":"investor","ring":3,"connectedTo":["Kojo","Miter"],"howConnected":"","description":"Multi-stage (VC and PE). ","sourcingValue":"Broader fund mandate. Larger check size on average-- opportunity to information share on smaller deals.","connBlack":"","connRed":"","hasRed":false,"isTarget":false},{"name":"Wesco International","type":"Strategic Investor","cat":"investor","ring":3,"connectedTo":["Kojo"],"howConnected":"","description":"Largest US electrical distributor. NYSE:WCC.","sourcingValue":"100,000+ contractor customers. Opportunity to information share with corporate development team, particularly on smaller deals","connBlack":"","connRed":"","hasRed":false,"isTarget":false},{"name":"Fifth Wall","type":"PropTech VC","cat":"investor","ring":3,"connectedTo":["TrueBuilt"],"howConnected":"","description":"Prop-tech and construction tech thesis. NYC.","sourcingValue":"Explicit contech thesis. Opportunity to trade notes on pipeline and partner on portfolio downstream capital.","connBlack":"","connRed":"","hasRed":false,"isTarget":false},{"name":"Accel","type":"VC","cat":"investor","ring":3,"connectedTo":["PermitFlow"],"howConnected":"","description":"Multi-stage.","sourcingValue":"Opportunity to trade notes on pipeline and partner on portfolio downstream capital.","connBlack":"","connRed":"Direct (Salmira).","hasRed":true,"isTarget":false},{"name":"AlleyCorp","type":"Incubator / VC","cat":"investor","ring":3,"connectedTo":["Tough Leaf"],"howConnected":"","description":"VC fund led by Kevin Ryan. Incubator. NYC.","sourcingValue":"Active NYC presence. Opportunity to trade notes on pipeline and partner on portfolio downstream capital.","connBlack":"","connRed":"Direct (Salmira, GSV).","hasRed":true,"isTarget":false}];
const cv=document.getElementById('c'),cx=cv.getContext('2d'),el=document.getElementById('el');
let W,H,sR=false,sT=false,sel=null,hov=null,zm=1,ppx=0,ppy=0,drg=false,ds={x:0,y:0},ps={x:0,y:0};
let P=[];

// Vendor=yellow, Competitor=orange (swapped from before)
const CAT_COL={portfolio:'#e8ecf4',investor:'#60a5fa',vendor:'#fbbf24',competitor:'#f97316',adjacent:'#a78bfa'};
const NR={0:28,1:16,2:13,3:10};
const GREEN='#fef3c7';

function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;comp();draw()}

function comp(){
  const ox=W/2,oy=H/2;
  const base=Math.min(W,H)*0.44;
  const rr=[0,base*0.2,base*0.46,base*0.76];
  P=D.map(n=>{
    if(n.ring===0)return{x:ox,y:oy,n,r:NR[0]};
    const rn=D.filter(d=>d.ring===n.ring);
    const i=rn.indexOf(n),c=rn.length;
    const a=(i/c)*Math.PI*2 - Math.PI/2;
    return{x:ox+Math.cos(a)*rr[n.ring],y:oy+Math.sin(a)*rr[n.ring],n,r:NR[n.ring]};
  });
}

function gP(name){return P.find(p=>p.n.name===name||name.toLowerCase().includes(p.n.name.toLowerCase())||p.n.name.toLowerCase().includes(name.toLowerCase()))}
function tW(sx,sy){return{x:(sx-W/2-ppx)/zm+W/2,y:(sy-H/2-ppy)/zm+H/2}}

function draw(){
  cx.clearRect(0,0,W,H);
  cx.save();
  cx.translate(W/2+ppx,H/2+ppy);cx.scale(zm,zm);cx.translate(-W/2,-H/2);
  
  const ox=W/2,oy=H/2,base=Math.min(W,H)*0.44;
  [0.2,0.46,0.76].forEach(f=>{cx.beginPath();cx.arc(ox,oy,base*f,0,Math.PI*2);cx.strokeStyle='rgba(255,255,255,0.025)';cx.lineWidth=1;cx.stroke()});
  
  // Edges
  P.forEach(p=>{
    p.n.connectedTo.forEach(t=>{
      const tp=gP(t);if(!tp)return;
      const isSel=sel&&(sel.name===p.n.name||sel.name===tp.n.name);
      const isREdge=sR&&(p.n.hasRed||tp.n.hasRed);
      cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(tp.x,tp.y);
      if(sel){
        if(isSel){
          if(sR&&(p.n.hasRed||tp.n.hasRed)){
            cx.strokeStyle='rgba(254,243,199,0.5)';cx.lineWidth=2;
          }else{
            cx.strokeStyle='rgba(255,255,255,0.35)';cx.lineWidth=1.8;
          }
        }else{cx.strokeStyle='rgba(255,255,255,0.03)';cx.lineWidth=0.5}
      }else if(sR&&isREdge){
        cx.strokeStyle='rgba(254,243,199,0.3)';cx.lineWidth=1.3;
      }else{
        cx.strokeStyle='rgba(255,255,255,0.13)';cx.lineWidth=0.8;
      }
      cx.stroke();
    });
  });
  
  // Nodes
  P.forEach(p=>{
    const{n,x,y,r}=p;
    const isH=hov===n,isS=sel===n;
    const cTS=sel&&(sel.connectedTo.some(c=>c.toLowerCase().includes(n.name.toLowerCase())||n.name.toLowerCase().includes(c.toLowerCase()))||n.connectedTo.some(c=>c.toLowerCase().includes(sel.name.toLowerCase())||sel.name.toLowerCase().includes(c.toLowerCase())));
    const dr=isH?r*1.2:isS?r*1.15:r;
    let alpha=sel&&!isS&&!cTS?0.1:1;
    let fill=CAT_COL[n.cat]||'#60a5fa';
    
    if(sT&&n.isTarget){
      cx.beginPath();cx.arc(x,y,dr+5,0,Math.PI*2);
      const g=cx.createRadialGradient(x,y,dr,x,y,dr+9);
      g.addColorStop(0,'rgba(251,191,36,0.3)');g.addColorStop(1,'rgba(251,191,36,0)');
      cx.globalAlpha=alpha;cx.fillStyle=g;cx.fill();
    }
    
    if(sR&&n.hasRed){
      cx.beginPath();cx.arc(x,y,dr+4,0,Math.PI*2);
      const g=cx.createRadialGradient(x,y,dr,x,y,dr+8);
      g.addColorStop(0,'rgba(254,243,199,0.3)');g.addColorStop(1,'rgba(254,243,199,0)');
      cx.globalAlpha=alpha;cx.fillStyle=g;cx.fill();
      fill=GREEN;
    }
    
    cx.beginPath();cx.arc(x,y,dr,0,Math.PI*2);
    cx.globalAlpha=alpha;cx.fillStyle=fill;cx.fill();
    if(isS){cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke()}
    
    if(sT&&n.isTarget&&!(sR&&n.hasRed)){
      cx.beginPath();cx.arc(x,y,dr+2,0,Math.PI*2);
      cx.strokeStyle='rgba(251,191,36,0.7)';cx.lineWidth=1.5;cx.stroke();
    }
    
    // Label - bigger font, truncate to avoid overlap
    const maxLabelW = n.ring===0?120:n.ring===1?90:n.ring===2?80:70;
    const fs=n.ring===0?14:n.ring===1?11:n.ring===2?10.5:9.5;
    cx.font=`${n.ring===0?700:n.ring<=1?600:500} ${fs}px 'DM Sans',sans-serif`;
    cx.fillStyle=alpha<0.2?`rgba(255,255,255,${alpha*2})`:'rgba(255,255,255,0.88)';
    cx.textAlign='center';cx.textBaseline='top';
    
    // Truncate label if too wide
    let lb=n.name;
    let measured=cx.measureText(lb).width;
    while(measured>maxLabelW&&lb.length>4){
      lb=lb.slice(0,-1);
      measured=cx.measureText(lb+'…').width;
    }
    if(lb!==n.name)lb+='…';
    
    cx.fillText(lb,x,y+dr+5);
    cx.globalAlpha=1;
  });
  
  cx.restore();
}

function togR(){sR=!sR;document.getElementById('tR').classList.toggle('on-g',sR);draw()}
function togT(){sT=!sT;document.getElementById('tT').classList.toggle('on-y',sT);draw()}

function closeSB(){document.getElementById('sb').classList.remove('open');sel=null;el.style.display='none';draw()}

function openSB(node){
  sel=node;
  const catNames={portfolio:'Portfolio Company',investor:'Investor',vendor:'Vendor',competitor:'Competitor',adjacent:'Adjacent'};
  const catCols={portfolio:'rgba(232,236,244,0.1)',investor:'rgba(96,165,250,0.12)',vendor:'rgba(251,191,36,0.12)',competitor:'rgba(249,115,22,0.12)',adjacent:'rgba(167,139,250,0.12)'};
  const catText={portfolio:'#e8ecf4',investor:'#60a5fa',vendor:'#fbbf24',competitor:'#f97316',adjacent:'#a78bfa'};
  
  let h=`<h2>${node.name}</h2>`;
  h+=`<span class="badge" style="background:${catCols[node.cat]};color:${catText[node.cat]}">${catNames[node.cat]}</span>`;
  h+=`<span class="badge" style="background:rgba(255,255,255,0.05);color:#5b6478">Ring ${node.ring}</span>`;
  if(node.isTarget) h+=`<span class="badge" style="background:rgba(251,191,36,0.12);color:#fbbf24">Potential Investment Target</span>`;
  
  if(node.description) h+=`<div class="sl">Description</div><p>${node.description}</p>`;
  if(node.sourcingValue) h+=`<div class="sl">Sourcing Value</div><p>${node.sourcingValue}</p>`;
  
  if(node.connBlack||node.connRed){
    h+=`<div class="sl">Connectivity</div>`;
    if(node.connBlack) h+=`<p>${node.connBlack}</p>`;
    if(node.connRed) h+=`<span class="r-line">✦ Rachael — ${node.connRed}</span>`;
  }
  
  document.getElementById('sbc').innerHTML=h;
  document.getElementById('sb').classList.add('open');
  draw();
}

function checkEdgeHover(mx,my){
  const wp=tW(mx,my);
  for(const p of P){
    for(const t of p.n.connectedTo){
      const tp=gP(t);if(!tp)continue;
      const how=p.n.howConnected||'';
      if(!how)continue;
      const dx=tp.x-p.x,dy=tp.y-p.y;
      const len2=dx*dx+dy*dy;if(len2===0)continue;
      let t2=((wp.x-p.x)*dx+(wp.y-p.y)*dy)/len2;
      t2=Math.max(0,Math.min(1,t2));
      const px2=p.x+t2*dx,py2=p.y+t2*dy;
      const dist=Math.sqrt((wp.x-px2)**2+(wp.y-py2)**2);
      if(dist<10/zm){
        el.textContent=how;
        el.style.display='block';
        el.style.left=(mx+14)+'px';
        el.style.top=(my-22)+'px';
        return true;
      }
    }
  }
  el.style.display='none';
  return false;
}

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.89;
  const nz=Math.max(0.3,Math.min(5,zm*f));
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  ppx=mx-(mx-ppx)*(nz/zm);ppy=my-(my-ppy)*(nz/zm);
  zm=nz;draw();
},{passive:false});

cv.addEventListener('mousedown',e=>{
  if(e.button===0){
    const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    const wp=tW(mx,my);
    for(const p of P){const dx=wp.x-p.x,dy=wp.y-p.y;if(dx*dx+dy*dy<(p.r+8)*(p.r+8))return}
    drg=true;ds={x:e.clientX,y:e.clientY};ps={x:ppx,y:ppy};cv.style.cursor='grabbing';
  }
});
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drg){ppx=ps.x+(e.clientX-ds.x);ppy=ps.y+(e.clientY-ds.y);draw();return}
  const wp=tW(mx,my);
  let found=null;
  for(const p of P){const dx=wp.x-p.x,dy=wp.y-p.y;if(dx*dx+dy*dy<(p.r+6)*(p.r+6)){found=p.n;break}}
  if(found!==hov){hov=found;cv.style.cursor=found?'pointer':'grab';draw()}
  if(!found)checkEdgeHover(mx,my);
  else el.style.display='none';
});
cv.addEventListener('mouseup',()=>{drg=false;cv.style.cursor=hov?'pointer':'grab'});
cv.addEventListener('click',e=>{
  if(drg)return;
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const wp=tW(mx,my);
  for(const p of P){const dx=wp.x-p.x,dy=wp.y-p.y;if(dx*dx+dy*dy<(p.r+8)*(p.r+8)){openSB(p.n);return}}
  closeSB();
});

function zIn(){zm=Math.min(zm*1.25,5);draw()}
function zOut(){zm=Math.max(zm/1.25,0.3);draw()}
function zRe(){zm=1;ppx=0;ppy=0;draw()}

window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
